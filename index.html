<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#2f6feb">
    <meta name="description" content="本地运行的小工具集合，免安装、免注册，数据不离开浏览器。">
    <title>小工具集 · 本地工具导航</title>
    <style>
        :root {
            --bg: #f5f6f8;
            --card: #ffffff;
            --line: #e4e8ef;
            --text: #1f2328;
            --muted: #6b7280;
            --primary: #2f6feb;
            --primary-soft: #eaf1fe;
            --radius: 12px;
        }

        * {
            box-sizing: border-box;
        }

        html {
            -webkit-text-size-adjust: 100%;
        }

        body {
            margin: 0;
            background: var(--bg);
            color: var(--text);
            font-family: "Microsoft YaHei", "PingFang SC", system-ui, -apple-system, sans-serif;
            font-size: 14px;
            line-height: 1.6;
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        /* 顶栏 */
        .topbar {
            position: sticky;
            top: 0;
            z-index: 20;
            background: rgba(255, 255, 255, .86);
            backdrop-filter: saturate(180%) blur(10px);
            border-bottom: 1px solid var(--line);
        }

        .topbar-inner {
            max-width: 1120px;
            margin: 0 auto;
            padding: 0 20px;
            height: 56px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 9px;
            font-weight: 700;
            font-size: 16px;
        }

        .brand-mark {
            width: 28px;
            height: 28px;
            border-radius: 8px;
            background: linear-gradient(135deg, #4b8bff, #2f6feb);
            color: #fff;
            display: grid;
            place-items: center;
            font-size: 15px;
            box-shadow: 0 3px 8px rgba(47, 111, 235, .3);
        }

        .topbar-note {
            color: var(--muted);
            font-size: 12px;
        }

        /* 头部 */
        .hero {
            padding: 44px 20px 30px;
            text-align: center;
            background:
                radial-gradient(760px 220px at 50% -60px, rgba(47, 111, 235, .10), transparent 70%);
        }

        .hero h1 {
            margin: 0 0 10px;
            font-size: 30px;
            letter-spacing: .5px;
        }

        .hero h1 span {
            color: var(--primary);
        }

        .hero p {
            margin: 0 auto 22px;
            max-width: 560px;
            color: var(--muted);
            font-size: 14px;
        }

        .search {
            position: relative;
            max-width: 520px;
            margin: 0 auto;
        }

        .search .ico {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: #9aa3b2;
            font-size: 15px;
            pointer-events: none;
        }

        .search input {
            width: 100%;
            height: 46px;
            padding: 0 42px 0 40px;
            border: 1px solid var(--line);
            border-radius: 999px;
            background: #fff;
            font: inherit;
            font-size: 14px;
            color: var(--text);
            box-shadow: 0 2px 10px rgba(31, 35, 40, .04);
            transition: border-color .15s, box-shadow .15s;
        }

        .search input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(47, 111, 235, .12);
        }

        .search .clear {
            position: absolute;
            right: 8px;
            top: 50%;
            transform: translateY(-50%);
            width: 26px;
            height: 26px;
            border: 0;
            border-radius: 50%;
            background: #eef1f6;
            color: #6b7280;
            cursor: pointer;
            font-size: 14px;
            line-height: 1;
            display: none;
        }

        .search .clear:hover {
            background: #e2e7ef;
            color: #333;
        }

        .search.has-value .clear {
            display: block;
        }

        .search-area {
            max-width: 520px;
            margin: 0 auto;
        }

        .search-area .tip {
            display: block;
            width: 100%;
            max-width: none;
            margin: 10px 0 0;
            font-size: 12px;
            color: #98a1b0;
            text-align: center;
            line-height: 1.9;
        }

        kbd {
            font-family: inherit;
            font-size: 11px;
            padding: 1px 5px;
            border-radius: 4px;
            border: 1px solid #d7dce5;
            border-bottom-width: 2px;
            background: #fff;
            color: #6b7280;
        }

        /* 主体 */
        .main {
            max-width: 1120px;
            margin: 0 auto;
            padding: 0 20px 60px;
        }

        .cats {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            align-items: center;
            margin-bottom: 18px;
        }

        .cat-chip {
            font: inherit;
            font-size: 13px;
            padding: 6px 14px;
            cursor: pointer;
            border: 1px solid var(--line);
            border-radius: 999px;
            background: #fff;
            color: #4b5563;
            transition: all .15s;
        }

        .cat-chip:hover {
            border-color: #c3d4f7;
            color: var(--primary);
        }

        .cat-chip.active {
            background: var(--primary);
            border-color: var(--primary);
            color: #fff;
            box-shadow: 0 3px 10px rgba(47, 111, 235, .25);
        }

        .result-count {
            margin-left: auto;
            font-size: 12px;
            color: var(--muted);
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 14px;
        }

        .card {
            display: block;
            background: var(--card);
            border: 1px solid var(--line);
            border-radius: var(--radius);
            padding: 16px 16px 14px;
            transition: transform .18s ease, box-shadow .18s ease, border-color .18s ease;
            position: relative;
        }

        .card:hover,
        .card:focus-visible {
            transform: translateY(-3px);
            border-color: #b9d0f8;
            box-shadow: 0 10px 24px rgba(31, 35, 40, .09);
            outline: none;
        }

        .card-top {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 10px;
        }

        .card .icon {
            width: 38px;
            height: 38px;
            border-radius: 10px;
            display: grid;
            place-items: center;
            font-size: 19px;
            background: linear-gradient(135deg, #eef4ff, #e2ecff);
            border: 1px solid #dbe7fe;
        }

        .card .tag {
            font-size: 11px;
            color: #7c8899;
            background: #f4f6fa;
            border: 1px solid #e8ecf3;
            border-radius: 999px;
            padding: 1px 9px;
            white-space: nowrap;
        }

        .card h3 {
            margin: 12px 0 4px;
            font-size: 15px;
            font-weight: 700;
        }

        .card p {
            margin: 0;
            color: var(--muted);
            font-size: 12.5px;
            line-height: 1.65;
        }

        .card .go {
            margin-top: 12px;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            font-size: 12px;
            color: var(--primary);
            opacity: 0;
            transform: translateX(-4px);
            transition: opacity .18s, transform .18s;
        }

        .card:hover .go,
        .card:focus-visible .go {
            opacity: 1;
            transform: translateX(0);
        }

        .empty {
            padding: 48px 20px;
            text-align: center;
            color: var(--muted);
            font-size: 13px;
            background: #fff;
            border: 1px dashed var(--line);
            border-radius: var(--radius);
        }

        .empty b {
            display: block;
            color: #4b5563;
            font-size: 14px;
            margin-bottom: 6px;
        }

        .empty button {
            margin-top: 14px;
            font: inherit;
            font-size: 13px;
            padding: 6px 16px;
            cursor: pointer;
            border: 1px solid #c5ccd6;
            border-radius: 8px;
            background: #fff;
            color: #333;
        }

        .empty button:hover {
            background: #f0f3f7;
        }

        footer {
            max-width: 1120px;
            margin: 0 auto;
            padding: 0 20px 40px;
            color: #9aa3b2;
            font-size: 12px;
            text-align: center;
        }

        @media (max-width: 640px) {
            .hero {
                padding: 30px 16px 22px;
            }

            .hero h1 {
                font-size: 24px;
            }

            .hero p {
                font-size: 13px;
            }

            .main {
                padding: 0 16px 40px;
            }

            .topbar-note {
                display: none;
            }

            .grid {
                grid-template-columns: 1fr;
            }

            .result-count {
                margin-left: 0;
                width: 100%;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            * {
                transition: none !important;
            }

            .card:hover {
                transform: none;
            }
        }
    </style>
</head>

<body>

    <header class="topbar">
        <div class="topbar-inner">
            <div class="brand"><span class="brand-mark">🧰</span>小工具集</div>
            <div class="topbar-note">全部本地运行 · 数据不出浏览器</div>
        </div>
    </header>

    <section class="hero">
        <h1>小工具<span>集</span></h1>
        <p>常用小工具聚合入口，免安装、免注册，打开即用。</p>

        <div class="search-area">
            <div class="search" id="searchBox">
                <span class="ico">🔍</span>
                <input id="searchInput" type="search" autocomplete="off" placeholder="搜索工具，如：SQL、去重、回车…"
                    aria-label="搜索工具">
                <button class="clear" id="clearBtn" type="button" aria-label="清空搜索">✕</button>
            </div>
            <p class="tip">按 <kbd>/</kbd> 或 <kbd>Ctrl</kbd> + <kbd>K</kbd> 快速搜索</p>
        </div>
    </section>

    <main class="main">
        <div class="cats" id="cats">
            <span class="result-count" id="count"></span>
        </div>
        <div class="grid" id="grid"></div>
    </main>

    <footer>数据全部在本地浏览器处理，不上传任何内容。</footer>

    <script src="assets/tools.js"></script>
    <script>
        (function () {
            'use strict';

            /* ── 工具清单在 assets/tools.js 里维护（首页与工具页顶部搜索共用一份）
               name  工具名称
               desc  简短描述
               icon  图标（emoji 或单个字符）
               cat   分类，用于筛选
               tags  搜索关键词（补充说明里没有的词）
               path  相对首页的跳转路径，目录结构变了只改那里
            ─────────────────────────────────────────────────────── */
            var TOOLS = window.TOOLS || [];

            var state = { cat: '全部', q: '' };

            var gridEl = document.getElementById('grid');
            var catsEl = document.getElementById('cats');
            var countEl = document.getElementById('count');
            var searchBox = document.getElementById('searchBox');
            var searchInput = document.getElementById('searchInput');

            function categories() {
                var out = ['全部'];
                TOOLS.forEach(function (t) {
                    if (out.indexOf(t.cat) === -1) out.push(t.cat);
                });
                return out;
            }

            function renderCats() {
                catsEl.querySelectorAll('.cat-chip').forEach(function (n) { n.remove(); });
                categories().forEach(function (cat, i) {
                    var btn = document.createElement('button');
                    btn.type = 'button';
                    btn.className = 'cat-chip' + (state.cat === cat ? ' active' : '');
                    btn.textContent = cat;
                    btn.addEventListener('click', function () {
                        state.cat = cat;
                        render();
                    });
                    var anchor = countEl || null;
                    catsEl.insertBefore(btn, anchor);
                });
            }

            function matches(tool) {
                if (state.cat !== '全部' && tool.cat !== state.cat) return false;
                if (!state.q) return true;
                var hay = (tool.name + ' ' + tool.desc + ' ' + tool.cat + ' ' + (tool.tags || '')).toLowerCase();
                return state.q.toLowerCase().split(/\s+/).every(function (kw) {
                    return !kw || hay.indexOf(kw) !== -1;
                });
            }

            function renderGrid(list) {
                gridEl.textContent = '';
                if (!list.length) {
                    var empty = document.createElement('div');
                    empty.className = 'empty';
                    var title = document.createElement('b');
                    title.textContent = '没有找到匹配的工具';
                    empty.appendChild(title);
                    empty.appendChild(document.createTextNode('换个关键词，或清空筛选条件再试试。'));
                    var btn = document.createElement('button');
                    btn.type = 'button';
                    btn.textContent = '清空筛选';
                    btn.addEventListener('click', resetFilters);
                    empty.appendChild(document.createElement('br'));
                    empty.appendChild(btn);
                    empty.style.gridColumn = '1 / -1';
                    gridEl.appendChild(empty);
                    return;
                }
                list.forEach(function (tool) {
                    var a = document.createElement('a');
                    a.className = 'card';
                    a.href = encodeURI(tool.path);
                    a.setAttribute('aria-label', tool.name + '：' + tool.desc);

                    var top = document.createElement('div');
                    top.className = 'card-top';
                    var icon = document.createElement('span');
                    icon.className = 'icon';
                    icon.textContent = tool.icon;
                    var tag = document.createElement('span');
                    tag.className = 'tag';
                    tag.textContent = tool.cat;
                    top.appendChild(icon);
                    top.appendChild(tag);

                    var h3 = document.createElement('h3');
                    h3.textContent = tool.name;
                    var p = document.createElement('p');
                    p.textContent = tool.desc;
                    var go = document.createElement('span');
                    go.className = 'go';
                    go.textContent = '打开 →';

                    a.appendChild(top);
                    a.appendChild(h3);
                    a.appendChild(p);
                    a.appendChild(go);
                    gridEl.appendChild(a);
                });
            }

            function render() {
                renderCats();
                var list = TOOLS.filter(matches);
                renderGrid(list);
                countEl.textContent = state.q || state.cat !== '全部'
                    ? '找到 ' + list.length + ' 个工具'
                    : '共 ' + TOOLS.length + ' 个工具';
                searchBox.classList.toggle('has-value', !!searchInput.value);
            }

            function resetFilters() {
                state.cat = '全部';
                state.q = '';
                searchInput.value = '';
                render();
                searchInput.focus();
            }

            searchInput.addEventListener('input', function () {
                state.q = searchInput.value.trim();
                render();
            });
            document.getElementById('clearBtn').addEventListener('click', function () {
                searchInput.value = '';
                state.q = '';
                render();
                searchInput.focus();
            });

            // 快捷键：/ 或 Ctrl+K 聚焦搜索
            document.addEventListener('keydown', function (e) {
                var typing = /^(input|textarea|select)$/i.test(e.target.tagName);
                if ((e.key === '/' && !typing) || ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k')) {
                    e.preventDefault();
                    searchInput.focus();
                    searchInput.select();
                }
            });

            render();
        })();
    </script>
</body>

</html>
